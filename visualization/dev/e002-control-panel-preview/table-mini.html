<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>E-002 Dynamic Table miniature</title>
  <link rel="stylesheet" href="../../../shared/episode-loading.css">
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#fffcf6}
    #globeStage,#scene,#satelliteScreenLabels{position:absolute;inset:0;width:100%;height:100%}
    #scene canvas{display:block;width:100%;height:100%}
    #satelliteScreenLabels{pointer-events:none}
    .satelliteScreenLabel{display:none}
    .satelliteScreenLabel[hidden],#sceneStatus:empty{display:none}
    .orbit-tooltip{position:absolute;z-index:3;max-width:235px;padding:7px 9px;border:1px solid #ded8c7;border-radius:5px;background:#fffdf7ed;box-shadow:0 3px 10px #0002;color:#5d5647;font:10px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;pointer-events:none}
    .orbit-tooltip[hidden]{display:none}
    #sceneStatus{position:absolute;right:8px;bottom:8px;z-index:2;max-width:240px;padding:5px 7px;border:1px solid #e6dbbd;border-radius:4px;background:#fffdf8e8;color:#756952;font:10px/1.3 sans-serif}
    #panelColumn,#modelCaveat,#modeBtn,#referenceBtn,#zoomInBtn,#zoomOutBtn{display:none}
    body.loop-reset #globeStage{opacity:1}
    #globeStage{transition:opacity .3s ease}
    #miniBoot{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#fffcf6;color:#786b54;font:700 11px/1.2 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    #miniBoot[hidden]{display:none}
    @media(prefers-reduced-motion:reduce){body.loop-reset #globeStage,#globeStage{transition:none}}
  </style>
  <script type="importmap">{"imports":{"three":"../../Viz/vendor/three/three.module.js","three/addons/":"../../Viz/vendor/three/addons/"}}</script>
  <script src="../../Viz/vendor/satellite/satellite.min.js"></script>
  <script type="module" src="./table-mini.js?v=12"></script>
  <link rel="preconnect" href="https://willamadsen.github.io" crossorigin>
</head>
<body>
  <div id="miniBoot" role="status"><span class="espl-loading-dots" aria-hidden="true"><i></i><i></i><i></i></span><span id="miniBootText">Loading episode</span></div>
  <div id="globeStage" aria-label="E-002 table preview with modeled reference orbit">
    <div id="scene"></div><div id="satelliteScreenLabels"></div>
    <div id="panelColumn"></div><p id="sceneStatus"></p><p id="modelCaveat"></p>
    <button id="modeBtn" type="button"></button><button id="referenceBtn" type="button"></button>
    <button id="zoomInBtn" type="button"></button><button id="zoomOutBtn" type="button"></button>
  </div>
</body>
</html>
